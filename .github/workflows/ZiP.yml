name: Build All Outputs (Web, Android APK, Windows EXE)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. BUILD STATIC WEB APPLICATION
  # -------------------------------------------------------------
  build-static-web:
    name: 1. Static Web Application Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Compress Web Dist Bundle
        run: |
          cd dist
          zip -r ../yadman-web-app.zip .
          cd ..

      - name: Upload Web Artifact (Folder)
        uses: actions/upload-artifact@v4
        with:
          name: yadman-web-static
          path: dist/
          retention-days: 14

      - name: Upload Web Archive (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: yadman-web-app-zip
          path: yadman-web-app.zip
          retention-days: 14

  # -------------------------------------------------------------
  # 2. BUILD ANDROID APK (via Capacitor)
  # -------------------------------------------------------------
  build-android-apk:
    name: 2. Android APK Build (.apk)
    runs-on: ubuntu-latest
    needs: build-static-web
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Java JDK 21 (Required for Capacitor 7 & Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Download Web Dist Bundle
        uses: actions/download-artifact@v4
        with:
          name: yadman-web-static
          path: dist

      - name: Fallback Build if Dist Missing
        run: |
          if [ ! -f "dist/index.html" ]; then
            npm run build
          fi

      - name: Configure Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Release Signing Keystore
        run: |
          if [ ! -f "android/app/release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias yadman \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass yadman123 \
              -keypass yadman123 \
              -dname "CN=Yadman App, OU=Yadman, O=Yadman, L=Tehran, ST=Tehran, C=IR"
          fi

      - name: Build Android Release & Debug APK with Gradle
        run: |
          echo "=== Java Environment Diagnostic ==="
          java -version
          javac -version
          echo "JAVA_HOME is: $JAVA_HOME"
          export JAVA_HOME=$JAVA_HOME
          export PATH=$JAVA_HOME/bin:$PATH
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --stacktrace
          cd ..
          mkdir -p release-apks
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apks/yadman-v1.0.0-release.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/aligned.apk
            $BUILD_TOOLS/apksigner sign --ks android/app/release.keystore --ks-pass pass:yadman123 --ks-key-alias yadman --key-pass pass:yadman123 --v1-signing-enabled true --v2-signing-enabled true --out release-apks/yadman-v1.0.0-release.apk release-apks/aligned.apk
          fi
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/yadman-v1.0.0-debug.apk
          fi
          ls -la release-apks/

      - name: Upload Android Release APK (نسخه اصلی نهایی)
        uses: actions/upload-artifact@v4
        with:
          name: yadman-android-release-apk
          path: release-apks/yadman-v1.0.0-release.apk
          retention-days: 14

      - name: Upload Android Debug APK (نسخه آزمایشی دیباگ)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yadman-android-debug-apk
          path: release-apks/yadman-v1.0.0-debug.apk
          retention-days: 14

  # -------------------------------------------------------------
  # 3. BUILD WINDOWS EXECUTABLE (.exe)
  # -------------------------------------------------------------
  build-windows-exe:
    name: 3. Windows Executable Build (.exe)
    runs-on: windows-latest
    needs: build-static-web
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Windows Native Rolldown Binding
        run: npm install --no-save @rolldown/binding-win32-x64-msvc@1.2.8

      - name: Download Web Dist Bundle
        uses: actions/download-artifact@v4
        with:
          name: yadman-web-static
          path: dist

      - name: Verify Web Production Assets
        shell: pwsh
        run: |
          if (!(Test-Path "dist/index.html")) {
            Write-Host "dist/index.html not found, running build..."
            npm run build
          } else {
            Write-Host "dist/index.html successfully retrieved from web build artifact!"
          }

      - name: Build Windows Installer & Portable Executables (.exe)
        run: npx electron-builder --win nsis portable

      - name: Upload Windows Executables (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: yadman-windows-exe
          path: release/*.exe
          retention-days: 14
