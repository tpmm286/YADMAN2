name: Build Yadman

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
          npm install @capacitor/assets --save-dev --legacy-peer-deps

      - name: Prepare Android icon
        shell: bash
        run: |
          mkdir -p assets
          cp public/pwa-512x512.png assets/icon.png

      - name: Build Web
        run: npm run build

      - name: Add Capacitor Android
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Set Android minimum SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/variables.gradle")
          text = path.read_text()

          if re.search(r"minSdkVersion\s*=", text):
              text = re.sub(
                  r"minSdkVersion\s*=\s*\d+",
                  "minSdkVersion = 24",
                  text
              )
          else:
              text += "\nminSdkVersion = 24\n"

          path.write_text(text)
          print("minSdkVersion set to 24")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android Icons
        shell: bash
        run: |
          npx @capacitor/assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'

      - name: Sync Capacitor Again
        run: npx cap sync android

      - name: Check Java and Gradle
        shell: bash
        run: |
          java -version
          cd android
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android Release
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Remove Old Keystore
        shell: bash
        run: |
          rm -f upload-keystore.jks
          rm -f yadman-release.keystore

      - name: Create Keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore upload-keystore.jks \
            -alias yadman \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass yadman123 \
            -keypass yadman123 \
            -dname "CN=Yadman, OU=Yadman, O=Yadman, L=Paris, ST=France, C=FR"

          keytool -list \
            -keystore upload-keystore.jks \
            -storepass yadman123

      - name: Sign APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android/app/build/outputs/apk/release/app-release-aligned.apk"
          FINAL="android/app/build/outputs/apk/release/Yadman.apk"

          test -f "$UNSIGNED"

          "$BUILD_TOOLS/zipalign" \
            -v -p 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks upload-keystore.jks \
            --ks-key-alias yadman \
            --ks-pass pass:yadman123 \
            --key-pass pass:yadman123 \
            --out "$FINAL" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$FINAL"

          echo "Signed APK:"
          ls -lh "$FINAL"

      - name: Create Android Release ZIP
        shell: bash
        run: |
          set -e

          rm -rf android-release
          mkdir -p android-release

          cp android/app/build/outputs/apk/release/Yadman.apk android-release/Yadman.apk
          cp upload-keystore.jks android-release/upload-keystore.jks

          echo "Yadman Android Release" > android-release/README.txt
          echo "APK: Yadman.apk" >> android-release/README.txt
          echo "Keystore: upload-keystore.jks" >> android-release/README.txt
          echo "Alias: yadman" >> android-release/README.txt
          echo "Keystore password: yadman123" >> android-release/README.txt
          echo "Key password: yadman123" >> android-release/README.txt
          echo "Keep the keystore safe for future updates." >> android-release/README.txt

          cd android-release
          zip -r ../Yadman-Android-Release.zip Yadman.apk upload-keystore.jks README.txt
          cd ..

          echo "ZIP created:"
          ls -lh Yadman-Android-Release.zip

      - name: Upload Android Release
        uses: actions/upload-artifact@v4
        with:
          name: Yadman-Android-Release
          path: Yadman-Android-Release.zip
          if-no-files-found: error

  web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps

      - name: Build Web
        run: npm run build

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: Yadman-Web
          path: dist
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps

      - name: Build Web
        run: npm run build

      - name: Build Windows EXE
        run: npm run electron:build

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Yadman-Windows
          path: release/*
          if-no-files-found: error
